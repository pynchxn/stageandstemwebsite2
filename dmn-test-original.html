<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>DMN TEST A — original Wizard code</title>
  <style>
    body { background:#111; color:#eee; font:14px/1.6 system-ui, sans-serif; margin:0; padding:1rem; }
    h1 { font-size:1rem; margin:0 0 .25rem; }
    .lede { color:#999; font-size:.8rem; margin:0 0 1rem; }
    #diag { border:1px solid #444; padding:.75rem; margin-bottom:1rem; font:12px/1.5 ui-monospace, monospace; white-space:pre-wrap; word-break:break-word; background:#000; }
    #diag .y { color:#4ade80; }
    #diag .n { color:#f87171; }
    #wrap { border:1px dashed #555; padding:1rem; min-height:60px; }
    nav a { color:#c9a96e; font-size:.8rem; }
  </style>
</head>
<body>

  <h1>TEST A — original Wizard code, unmodified</h1>
  <p class="lede">Control. Bare page: no site CSS, no nav. Verdict appears below after ~6 seconds.</p>

  <div id="diag">running…</div>

  <div id="wrap">

<!-- ===== BEGIN VERBATIM WIZARD SNIPPET — DO NOT EDIT ===== -->
<link rel="stylesheet" type="text/css" href="https://onsass.designmynight.com/?theme=dark&body-text-color=%23e1ec41&primary-color=%230ccf19&background-color=%23000000"><script src="//widgets.designmynight.com/bookings-partner.min.js" dmn-booking-form="true" venue="6a590682cf09d068cf42ee25" hide-offers="true" hide-powered-by="false" search-venues="false" monday-first="true" locale="undefined" show-type-first="true" return-url="https://www.stageandstem.com/" return-method="post"></script>
<!-- ===== END VERBATIM WIZARD SNIPPET ===== -->

  </div>

  <p><nav><a href="dmn-test-fixed.html">→ Compare with TEST B (corrected code)</a></nav></p>

  <script>
  (function () {
    var errors = [];
    window.addEventListener('error', function (e) {
      errors.push((e.message || 'error') + (e.filename ? '  @ ' + e.filename : ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      errors.push('promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });

    function yn(v) { return v ? '<span class="y">YES</span>' : '<span class="n">NO</span>'; }

    setTimeout(function () {
      var wrap = document.getElementById('wrap');
      var scriptEl = wrap.querySelector('script[dmn-booking-form]');
      var globals = ['BookingFormHelper', 'DMN', 'dmn', 'DMNWidget'].filter(function (g) { return typeof window[g] !== 'undefined'; });

      // any element inside the wrapper that isn't our own script/link = a rendered widget
      var rendered = Array.prototype.slice.call(wrap.querySelectorAll('*')).filter(function (el) {
        var t = el.tagName.toLowerCase();
        return t !== 'script' && t !== 'link';
      });

      var lines = [
        'TEST A — original Wizard code',
        '',
        'script tag found in DOM ..... ' + yn(!!scriptEl),
        'resolved script URL ........ ' + (scriptEl ? scriptEl.src : 'n/a'),
        'DMN global defined ......... ' + yn(globals.length > 0) + (globals.length ? '  [' + globals.join(', ') + ']' : ''),
        'widget rendered ............ ' + yn(rendered.length > 0) + '  (' + rendered.length + ' elements)',
        '',
        'JS errors captured: ' + (errors.length ? '' : 'none')
      ];
      if (errors.length) { lines = lines.concat(errors.map(function (e) { return '  · ' + e; })); }

      lines.push('');
      if (rendered.length > 0) {
        lines.push('>> Widget DID render here.');
      } else if (globals.length === 0) {
        lines.push('>> Script never loaded or never executed.');
        lines.push('   Blocked, 404, or failed. Check the URL above —');
        lines.push('   if it starts http:// the // prefix downgraded it.');
      } else {
        lines.push('>> Script loaded but rendered nothing.');
        lines.push('   Points at the Collins account/venue config:');
        lines.push('   booking types, plan tier, or authorised domain.');
      }

      document.getElementById('diag').innerHTML = lines.join('\n');
    }, 6000);
  })();
  </script>

</body>
</html>
